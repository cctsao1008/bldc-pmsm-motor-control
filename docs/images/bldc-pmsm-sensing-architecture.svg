<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">BLDC / PMSM Sensing Architecture</title>
<desc id="desc">Current, Hall, back-EMF, and DC-bus voltage feedback paths routed to an external controller.</desc>
<rect width="1200" height="760" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#172033}.title{font-size:40px;font-weight:700}.subtitle{font-size:22px;fill:#374151}.section{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px;fill:#556071}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wire{fill:none;stroke:#202733;stroke-width:2.2}.green{fill:none;stroke:#147a38;stroke-width:2.4}.orange{fill:none;stroke:#d86400;stroke-width:2.4}.purple{fill:none;stroke:#6f238b;stroke-width:2.4}.blue{fill:none;stroke:#173b8f;stroke-width:2.4}.box{fill:#fff;stroke:#a8b1bf;stroke-width:1.8}.term{fill:#fff;stroke:#202733;stroke-width:1.8}
</style>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#147a38" stroke-width="1.6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#d86400" stroke-width="1.6"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6f238b" stroke-width="1.6"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#173b8f" stroke-width="1.6"/></marker>
<g id="hres"><path d="M0 0h10l9-9 16 18 16-18 16 18 16-18 9 9h10" class="wire"/></g>
</defs>
<text class="title" x="600" y="46" text-anchor="middle">BLDC / PMSM Sensing Architecture</text>
<text class="subtitle" x="600" y="78" text-anchor="middle">Current / Hall / BEMF / Bus-Voltage Feedback</text>

<!-- Current sensing -->
<rect x="30" y="110" width="550" height="265" rx="16" fill="#fff" stroke="#147a38" stroke-width="2.2"/>
<text class="section" x="55" y="145" fill="#147a38">1) CURRENT SENSING</text>
<text class="small" x="55" y="168">Three independent low-side shunts</text>
<g class="label mono"><text x="60" y="220">R42 · 1 mΩ</text><text x="60" y="275">R43 · 1 mΩ</text><text x="60" y="330">R44 · 1 mΩ</text></g>
<g class="wire"><path d="M160 214H210"/><path d="M160 269H210"/><path d="M160 324H210"/></g>
<g class="box"><rect x="210" y="192" width="125" height="40" rx="5"/><rect x="210" y="247" width="125" height="40" rx="5"/><rect x="210" y="302" width="125" height="40" rx="5"/></g>
<g class="label mono"><text x="272" y="217" text-anchor="middle">INA181A1</text><text x="272" y="272" text-anchor="middle">INA181A1</text><text x="272" y="327" text-anchor="middle">INA181A1</text></g>
<g class="green" marker-end="url(#ag)"><path d="M335 212H395"/><path d="M335 267H395"/><path d="M335 322H395"/></g>
<g class="label mono" fill="#147a38"><text x="410" y="218">ISA</text><text x="410" y="273">ISB</text><text x="410" y="328">ISC</text></g>
<g class="small"><text x="465" y="218">→ ADC</text><text x="465" y="273">→ ADC</text><text x="465" y="328">→ ADC</text></g>
<text class="small mono" x="55" y="355">REF1V65 = 1.65 V zero-current reference</text>

<!-- Hall sensing -->
<rect x="620" y="110" width="550" height="265" rx="16" fill="#fff" stroke="#d86400" stroke-width="2.2"/>
<text class="section" x="645" y="145" fill="#d86400">2) HALL SENSING</text>
<rect class="box" x="675" y="185" width="65" height="145" rx="8"/>
<g class="term"><circle cx="707" cy="210" r="6"/><circle cx="707" cy="240" r="6"/><circle cx="707" cy="270" r="6"/><circle cx="707" cy="300" r="6"/><circle cx="707" cy="325" r="6"/></g>
<g class="orange" marker-end="url(#ao)"><path d="M745 210H845"/><path d="M745 240H845"/><path d="M745 270H845"/></g>
<g class="label mono" fill="#d86400"><text x="860" y="216">HALLA</text><text x="860" y="246">HALLB</text><text x="860" y="276">HALLC</text></g>
<g class="small"><text x="960" y="216">→ GPIO</text><text x="960" y="246">→ GPIO</text><text x="960" y="276">→ GPIO</text></g>
<path class="wire" d="M745 300H845"/><path class="wire" d="M745 325H845"/>
<text class="label mono" x="860" y="306">5V / 3V3</text><text class="small" x="960" y="306">Hall supply</text>
<text class="label mono" x="860" y="331">GND</text><text class="small" x="960" y="331">ground</text>

<!-- BEMF -->
<rect x="30" y="405" width="550" height="275" rx="16" fill="#fff" stroke="#6f238b" stroke-width="2.2"/>
<text class="section" x="55" y="440" fill="#6f238b">3) BACK-EMF SENSING</text>
<text class="small" x="55" y="463">Zero-cross detection for sensorless six-step</text>
<g class="label mono"><text x="65" y="520">MA</text><text x="65" y="575">MB</text><text x="65" y="630">MC</text></g>
<g><use href="#hres" transform="translate(105 514) scale(.62)"/><use href="#hres" transform="translate(105 569) scale(.62)"/><use href="#hres" transform="translate(105 624) scale(.62)"/></g>
<g class="label mono"><text x="180" y="520">EMFA</text><text x="180" y="575">EMFB</text><text x="180" y="630">EMFC</text></g>
<path d="M285 495L385 575L285 655Z" fill="#fff" stroke="#202733" stroke-width="2"/>
<text class="label" x="315" y="580">LM339</text>
<g class="purple" marker-end="url(#ap)"><path d="M385 540H455"/><path d="M385 575H455"/><path d="M385 610H455"/></g>
<g class="label mono" fill="#6f238b"><text x="470" y="546">EOA</text><text x="470" y="581">EOB</text><text x="470" y="616">EOC</text></g>
<text class="small" x="305" y="662" text-anchor="middle">phase signals → comparator → controller GPIO</text>

<!-- Bus voltage -->
<rect x="620" y="405" width="550" height="275" rx="16" fill="#fff" stroke="#173b8f" stroke-width="2.2"/>
<text class="section" x="645" y="440" fill="#173b8f">4) BUS VOLTAGE SENSING</text>
<text class="label mono" x="665" y="535">VM</text><circle class="term" cx="715" cy="529" r="5"/><path class="wire" d="M720 529H790"/><use href="#hres" transform="translate(790 529) scale(.72)"/>
<text class="small mono" x="830" y="505" text-anchor="middle">R_TOP</text>
<circle cx="885" cy="529" r="5" fill="#202733"/>
<path class="blue" d="M885 529H1010" marker-end="url(#ab)"/><text class="label mono" x="1025" y="535" fill="#173b8f">VAD</text><text class="small" x="1080" y="535">→ ADC</text>
<path class="wire" d="M885 529V580"/><use href="#hres" transform="translate(839 580) rotate(90) scale(.72)"/><path class="wire" d="M885 646V655"/><path class="wire" d="M865 655H905M873 664H897M881 673H889"/>
<text class="small mono" x="925" y="615">R_BOTTOM</text>
<text class="small" x="895" y="565">scaled DC-bus voltage</text>

<text class="small" x="600" y="725" text-anchor="middle">Feedback signals are routed to the external controller.</text>
</svg>