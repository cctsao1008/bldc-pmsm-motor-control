<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">BLDC / PMSM Sensing Architecture</title>
<desc id="desc">Three-shunt low-side current sensing, Hall feedback, three LM339 comparator channels for back-EMF, and DC-bus voltage sensing.</desc>
<rect width="1200" height="760" fill="#fff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111827}.title{font-size:38px;font-weight:700}.subtitle{font-size:21px;fill:#4b5563}.section{font-size:19px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#4b5563}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wire{fill:none;stroke:#1f2937;stroke-width:2}.thin{fill:none;stroke:#6b7280;stroke-width:1.5}.panel{fill:#fff;stroke:#9ca3af;stroke-width:1.6}.block{fill:#fff;stroke:#6b7280;stroke-width:1.5}.node{fill:#1f2937}.term{fill:#fff;stroke:#1f2937;stroke-width:1.5}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#1f2937" stroke-width="1.5"/></marker>
<g id="vshunt"><path d="M0 0v6l-7 8 14 10-14 10 14 10-7 8v6" class="wire"/></g>
<g id="hres"><path d="M0 0h9l8-8 15 16 15-16 15 16 15-16 8 8h9" class="wire"/></g>
</defs>
<text class="title" x="600" y="46" text-anchor="middle">BLDC / PMSM Sensing Architecture</text>
<text class="subtitle" x="600" y="77" text-anchor="middle">Current / Hall / BEMF / Bus-Voltage Feedback</text>

<!-- CURRENT SENSING -->
<rect class="panel" x="30" y="108" width="550" height="292" rx="15"/>
<text class="section" x="54" y="140">1) CURRENT SENSING</text>
<text class="small" x="54" y="160">Three independent low-side shunts; each INA181A1 measures directly across its shunt.</text>

<!-- Common ground exists only on the ground side of the three shunts. -->
<path class="wire" d="M245 180V345"/>
<path class="wire" d="M225 345H265M233 354H257M241 363H249"/>

<!-- Phase A -->
<text class="label mono" x="54" y="201">Phase A return</text><circle class="node" cx="175" cy="195" r="4"/>
<path class="wire" d="M179 195H188"/><use href="#hres" transform="translate(188 195) scale(.42)"/><path class="wire" d="M228 195H245"/>
<text class="small mono" x="190" y="218">R42 1 mΩ</text>
<rect class="block" x="292" y="175" width="120" height="42" rx="5"/><text class="label mono" x="352" y="201" text-anchor="middle">INA181A1</text>
<path class="thin" d="M175 195H270V186H292"/><path class="thin" d="M245 195H272V206H292"/>
<path class="wire" d="M412 196H448" marker-end="url(#arrow)"/><text class="label mono" x="460" y="202">ISA</text><text class="small" x="504" y="202">to ADC</text>

<!-- Phase B -->
<text class="label mono" x="54" y="261">Phase B return</text><circle class="node" cx="175" cy="255" r="4"/>
<path class="wire" d="M179 255H188"/><use href="#hres" transform="translate(188 255) scale(.42)"/><path class="wire" d="M228 255H245"/>
<text class="small mono" x="190" y="278">R43 1 mΩ</text>
<rect class="block" x="292" y="235" width="120" height="42" rx="5"/><text class="label mono" x="352" y="261" text-anchor="middle">INA181A1</text>
<path class="thin" d="M175 255H270V246H292"/><path class="thin" d="M245 255H272V266H292"/>
<path class="wire" d="M412 256H448" marker-end="url(#arrow)"/><text class="label mono" x="460" y="262">ISB</text><text class="small" x="504" y="262">to ADC</text>

<!-- Phase C -->
<text class="label mono" x="54" y="321">Phase C return</text><circle class="node" cx="175" cy="315" r="4"/>
<path class="wire" d="M179 315H188"/><use href="#hres" transform="translate(188 315) scale(.42)"/><path class="wire" d="M228 315H245"/>
<text class="small mono" x="190" y="338">R44 1 mΩ</text>
<rect class="block" x="292" y="295" width="120" height="42" rx="5"/><text class="label mono" x="352" y="321" text-anchor="middle">INA181A1</text>
<path class="thin" d="M175 315H270V306H292"/><path class="thin" d="M245 315H272V326H292"/>
<path class="wire" d="M412 316H448" marker-end="url(#arrow)"/><text class="label mono" x="460" y="322">ISC</text><text class="small" x="504" y="322">to ADC</text>

<!-- Common INA181 reference input; this is not part of the shunt current path. -->
<path class="thin" d="M352 217V372M352 277V372M352 337V372H430"/>
<text class="small mono" x="438" y="377">REF1V65 = 1.65 V</text>

<!-- HALL -->
<rect class="panel" x="620" y="108" width="550" height="292" rx="15"/>
<text class="section" x="644" y="140">2) HALL SENSING</text>
<text class="small" x="644" y="160">Three Hall feedback signals plus Hall-sensor supply and ground.</text>
<rect class="block" x="682" y="190" width="62" height="150" rx="7"/>
<g class="term"><circle cx="713" cy="214" r="5"/><circle cx="713" cy="244" r="5"/><circle cx="713" cy="274" r="5"/><circle cx="713" cy="304" r="5"/><circle cx="713" cy="330" r="5"/></g>
<g class="wire" marker-end="url(#arrow)"><path d="M748 214H845"/><path d="M748 244H845"/><path d="M748 274H845"/></g>
<path class="wire" d="M748 304H845M748 330H845"/>
<text class="label mono" x="860" y="220">HALLA</text><text class="label mono" x="860" y="250">HALLB</text><text class="label mono" x="860" y="280">HALLC</text><text class="label mono" x="860" y="310">V_HALL</text><text class="label mono" x="860" y="336">GND</text>
<text class="small" x="960" y="220">to controller GPIO</text><text class="small" x="960" y="250">to controller GPIO</text><text class="small" x="960" y="280">to controller GPIO</text><text class="small" x="960" y="310">5 V / 3.3 V supply</text><text class="small" x="960" y="336">ground</text>

<!-- BEMF -->
<rect class="panel" x="30" y="425" width="550" height="260" rx="15"/>
<text class="section" x="54" y="457">3) BACK-EMF SENSING</text>
<text class="small" x="54" y="477">Three separate LM339 comparator channels used for zero-cross detection.</text>
<g class="label mono"><text x="64" y="535">MA</text><text x="64" y="590">MB</text><text x="64" y="645">MC</text></g>
<g><use href="#hres" transform="translate(100 529) scale(.55)"/><use href="#hres" transform="translate(100 584) scale(.55)"/><use href="#hres" transform="translate(100 639) scale(.55)"/></g>
<g class="wire"><path d="M88 529H100M152 529H245"/><path d="M88 584H100M152 584H245"/><path d="M88 639H100M152 639H245"/></g>
<g class="small mono"><text x="170" y="518">EMFA</text><text x="170" y="573">EMFB</text><text x="170" y="628">EMFC</text></g>
<g class="block"><rect x="245" y="510" width="145" height="40" rx="5"/><rect x="245" y="565" width="145" height="40" rx="5"/><rect x="245" y="620" width="145" height="40" rx="5"/></g>
<g class="small"><text x="317" y="535" text-anchor="middle">LM339 comparator A</text><text x="317" y="590" text-anchor="middle">LM339 comparator B</text><text x="317" y="645" text-anchor="middle">LM339 comparator C</text></g>
<g class="wire" marker-end="url(#arrow)"><path d="M390 530H455"/><path d="M390 585H455"/><path d="M390 640H455"/></g>
<g class="label mono"><text x="470" y="536">EOA</text><text x="470" y="591">EOB</text><text x="470" y="646">EOC</text></g>
<text class="small" x="520" y="536">to GPIO</text><text class="small" x="520" y="591">to GPIO</text><text class="small" x="520" y="646">to GPIO</text>

<!-- BUS VOLTAGE -->
<rect class="panel" x="620" y="425" width="550" height="260" rx="15"/>
<text class="section" x="644" y="457">4) BUS VOLTAGE SENSING</text>
<text class="small" x="644" y="477">DC-bus divider output routed to the controller ADC.</text>
<text class="label mono" x="660" y="550">VM</text><circle class="term" cx="708" cy="544" r="5"/><path class="wire" d="M713 544H785"/><use href="#hres" transform="translate(785 544) scale(.7)"/><text class="small mono" x="825" y="520" text-anchor="middle">R_TOP</text>
<path class="wire" d="M851 544H880"/><circle class="node" cx="880" cy="544" r="4.5"/><path class="wire" d="M880 544H1000" marker-end="url(#arrow)"/><text class="label mono" x="1015" y="550">VAD</text><text class="small" x="1060" y="550">to ADC</text>
<path class="wire" d="M880 544V590"/><use href="#vshunt" transform="translate(880 590) scale(.62)"/><path class="wire" d="M880 626V657"/><path class="wire" d="M860 657H900M868 666H892M876 675H884"/>
<text class="small mono" x="915" y="617">R_BOTTOM</text><text class="small" x="890" y="575">scaled DC-bus voltage</text>

<text class="small" x="600" y="725" text-anchor="middle">Feedback signals are routed to the external controller.</text>
</svg>
