<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">BLDC / PMSM Sensing Architecture</title>
<desc id="desc">Three low-side current-shunt channels, Hall sensor inputs, back-EMF zero-cross detection, and DC-bus voltage sensing routed to an external controller.</desc>
<rect width="1600" height="1000" fill="#fff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#172033}.title{font-size:52px;font-weight:700}.subtitle{font-size:28px;fill:#374151}.section{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px;fill:#556071}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wire{fill:none;stroke:#202733;stroke-width:2.6}.green{fill:none;stroke:#147a38;stroke-width:2.8}.orange{fill:none;stroke:#d86400;stroke-width:2.8}.purple{fill:none;stroke:#6f238b;stroke-width:2.8}.blue{fill:none;stroke:#173b8f;stroke-width:2.8}.box{fill:#fff;stroke:#a8b1bf;stroke-width:2}.term{fill:#fff;stroke:#202733;stroke-width:2}</style>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#147a38" stroke-width="1.6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#d86400" stroke-width="1.6"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6f238b" stroke-width="1.6"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#173b8f" stroke-width="1.6"/></marker>
<g id="hres"><path d="M0 0h12l10-11 20 22 20-22 20 22 20-22 10 11h12" class="wire"/></g>
</defs>
<text class="title" x="800" y="64" text-anchor="middle">BLDC / PMSM Sensing Architecture</text><text class="subtitle" x="800" y="108" text-anchor="middle">Current / Hall / BEMF / Bus-Voltage Feedback</text>

<!-- Current sensing -->
<rect x="35" y="145" width="735" height="385" rx="20" fill="#fff" stroke="#147a38" stroke-width="2.5"/><text class="section" x="75" y="190" fill="#147a38">1) CURRENT SENSING</text><text class="small" x="330" y="190">three independent low-side shunts</text>
<g class="label mono"><text x="80" y="260">R42 1 mΩ</text><text x="80" y="345">R43 1 mΩ</text><text x="80" y="430">R44 1 mΩ</text></g>
<g class="small"><text x="80" y="285">Phase A low-side return</text><text x="80" y="370">Phase B low-side return</text><text x="80" y="455">Phase C low-side return</text></g>
<g class="wire"><path d="M250 250H315"/><path d="M250 335H315"/><path d="M250 420H315"/></g>
<g class="box"><rect x="315" y="220" width="180" height="60" rx="6"/><rect x="315" y="305" width="180" height="60" rx="6"/><rect x="315" y="390" width="180" height="60" rx="6"/></g>
<g class="label mono"><text x="405" y="258" text-anchor="middle">INA181A1</text><text x="405" y="343" text-anchor="middle">INA181A1</text><text x="405" y="428" text-anchor="middle">INA181A1</text></g>
<g class="green" marker-end="url(#ag)"><path d="M495 250H585"/><path d="M495 335H585"/><path d="M495 420H585"/></g><g class="label mono" fill="#147a38"><text x="600" y="258">ISA</text><text x="600" y="343">ISB</text><text x="600" y="428">ISC</text></g><g class="small"><text x="655" y="258">→ ADC</text><text x="655" y="343">→ ADC</text><text x="655" y="428">→ ADC</text></g>
<path class="wire" d="M405 475V500H575"/><circle class="term" cx="405" cy="475" r="6"/><text class="label mono" x="590" y="507">REF1V65 = 1.65 V</text><text class="small" x="590" y="527">zero-current output reference</text>

<!-- Hall sensing -->
<rect x="795" y="145" width="770" height="385" rx="20" fill="#fff" stroke="#d86400" stroke-width="2.5"/><text class="section" x="835" y="190" fill="#d86400">2) HALL SENSING</text>
<rect class="box" x="875" y="230" width="90" height="230" rx="10"/><g class="term"><circle cx="920" cy="260" r="8"/><circle cx="920" cy="305" r="8"/><circle cx="920" cy="350" r="8"/><circle cx="920" cy="395" r="8"/><circle cx="920" cy="440" r="8"/></g>
<g class="orange" marker-end="url(#ao)"><path d="M970 260H1115"/><path d="M970 305H1115"/><path d="M970 350H1115"/></g><g class="label mono" fill="#d86400"><text x="1135" y="268">HALLA</text><text x="1135" y="313">HALLB</text><text x="1135" y="358">HALLC</text></g><g class="small"><text x="1260" y="268">→ controller GPIO</text><text x="1260" y="313">→ controller GPIO</text><text x="1260" y="358">→ controller GPIO</text></g>
<path class="wire" d="M970 395H1115"/><path class="wire" d="M970 440H1115"/><text class="label mono" x="1135" y="403">5V / 3V3</text><text class="small" x="1260" y="403">Hall sensor supply</text><text class="label mono" x="1135" y="448">GND</text><text class="small" x="1260" y="448">ground</text>

<!-- BEMF -->
<rect x="35" y="555" width="735" height="370" rx="20" fill="#fff" stroke="#6f238b" stroke-width="2.5"/><text class="section" x="75" y="600" fill="#6f238b">3) BACK-EMF SENSING</text><text class="small" x="365" y="600">zero-cross detection</text>
<g class="label mono"><text x="80" y="680">MA</text><text x="80" y="755">MB</text><text x="80" y="830">MC</text></g><g><use href="#hres" transform="translate(135 672) scale(.75)"/><use href="#hres" transform="translate(135 747) scale(.75)"/><use href="#hres" transform="translate(135 822) scale(.75)"/></g><g class="label mono"><text x="255" y="680">EMFA</text><text x="255" y="755">EMFB</text><text x="255" y="830">EMFC</text></g>
<path d="M390 650L520 755L390 860Z" fill="#fff" stroke="#202733" stroke-width="2.2"/><text class="label" x="430" y="765">LM339</text><g class="purple" marker-end="url(#ap)"><path d="M520 710H615"/><path d="M520 755H615"/><path d="M520 800H615"/></g><g class="label mono" fill="#6f238b"><text x="635" y="718">EOA</text><text x="635" y="763">EOB</text><text x="635" y="808">EOC</text></g><text class="small" x="390" y="895" text-anchor="middle">phase-derived signals → comparator outputs → controller GPIO</text>

<!-- Bus voltage -->
<rect x="795" y="555" width="770" height="370" rx="20" fill="#fff" stroke="#173b8f" stroke-width="2.5"/><text class="section" x="835" y="600" fill="#173b8f">4) BUS VOLTAGE SENSING</text>
<text class="label mono" x="860" y="685">VM</text><circle class="term" cx="930" cy="678" r="7"/><path class="wire" d="M937 678H1040"/><use href="#hres" transform="translate(1040 678) scale(.9)"/><text class="small mono" x="1090" y="650" text-anchor="middle">R_TOP</text><circle cx="1170" cy="678" r="6" fill="#202733"/><path class="blue" d="M1170 678H1320" marker-end="url(#ab)"/><text class="label mono" x="1340" y="686" fill="#173b8f">VAD</text><text class="small" x="1400" y="686">→ ADC</text>
<path class="wire" d="M1170 678V755"/><use href="#hres" transform="translate(1114 755) rotate(90) scale(.9)"/><path class="wire" d="M1170 867V890"/><path class="wire" d="M1145 890H1195M1155 902H1185M1165 914H1175"/><text class="small mono" x="1210" y="810">R_BOTTOM</text><text class="small" x="1180" y="745">scaled DC-bus voltage</text>

<text class="small" x="800" y="970" text-anchor="middle">Feedback signals are routed to the external controller; power and sensing functions remain separate architectural blocks.</text>
</svg>