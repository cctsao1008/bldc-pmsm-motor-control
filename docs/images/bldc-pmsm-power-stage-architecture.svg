<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">BLDC / PMSM Power Stage Architecture</title>
<desc id="desc">External 6-PWM inputs drive three half bridges forming a three-phase six-switch inverter. Phase outputs MA, MB and MC are independent nodes. Each low-side leg returns through a one milliohm shunt.</desc>
<rect width="1600" height="900" fill="#fff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#172033}.title{font-size:54px;font-weight:700}.subtitle{font-size:30px;fill:#374151}.section{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:18px;fill:#556071}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wire{fill:none;stroke:#202733;stroke-width:3}.sig{fill:none;stroke:#173b8f;stroke-width:3}.box{fill:#fff;stroke:#173b8f;stroke-width:2.4}.powerbox{fill:#fff;stroke:#d72c2c;stroke-width:2.6}.node{fill:#202733}.term{fill:#fff;stroke:#202733;stroke-width:2}</style>
<defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#173b8f" stroke-width="1.7"/></marker><g id="fet"><rect x="-24" y="-42" width="48" height="84" rx="5" fill="#fff" stroke="#202733" stroke-width="2"/><path d="M-45 0h14M-17-24v48M-6-28v56M-6-28h18M-6 28h18" class="wire"/><path d="M12-28v16M12 12v16" class="wire"/><path d="M5 9l14-18H5z" fill="#202733"/></g><g id="vshunt"><path d="M0 0v12l-12 12 24 18-24 18 24 18-24 18 12 12v12" class="wire"/></g></defs>
<text class="title" x="800" y="70" text-anchor="middle">BLDC / PMSM Power Stage Architecture</text><text class="subtitle" x="800" y="116" text-anchor="middle">6-PWM Gate Drive + Three-Phase Six-Switch Inverter</text>
<text class="section" x="70" y="205" fill="#173b8f">PWM INPUTS</text><text class="small" x="70" y="235">from external controller</text>
<g class="label mono"><text x="70" y="310">INHA</text><text x="70" y="370">INLA</text><text x="70" y="430">INHB</text><text x="70" y="490">INLB</text><text x="70" y="550">INHC</text><text x="70" y="610">INLC</text></g>
<g class="sig" marker-end="url(#arrowBlue)"><path d="M150 303H245"/><path d="M150 363H245"/><path d="M150 423H245"/><path d="M150 483H245"/><path d="M150 543H245"/><path d="M150 603H245"/></g>
<rect class="box" x="250" y="265" width="220" height="390" rx="18"/><text class="section" x="360" y="410" text-anchor="middle" fill="#173b8f">3× Half-Bridge</text><text class="section" x="360" y="445" text-anchor="middle" fill="#173b8f">Gate Driver</text>
<g class="label mono" fill="#173b8f"><text x="490" y="310">HOA</text><text x="490" y="370">LOA</text><text x="490" y="430">HOB</text><text x="490" y="490">LOB</text><text x="490" y="550">HOC</text><text x="490" y="610">LOC</text></g><g class="sig" marker-end="url(#arrowBlue)"><path d="M470 303H570"/><path d="M470 363H570"/><path d="M470 423H570"/><path d="M470 483H570"/><path d="M470 543H570"/><path d="M470 603H570"/></g>
<rect class="powerbox" x="600" y="180" width="900" height="570" rx="22"/><text class="section" x="1050" y="215" text-anchor="middle" fill="#d72c2c">THREE-PHASE POWER STAGE</text><text class="small" x="1050" y="244" text-anchor="middle">three independent half-bridge phase nodes</text>
<text class="label" x="625" y="285">VM</text><circle class="term" cx="680" cy="278" r="7"/><path class="wire" d="M687 278H1385"/><text class="label" x="625" y="704">GND</text><circle class="term" cx="680" cy="697" r="7"/><path class="wire" d="M687 697H1385"/>
<!-- Phase A -->
<path class="wire" d="M800 278V315M800 399V460M800 460V500M800 584V610"/><use href="#fet" transform="translate(800 357)"/><use href="#fet" transform="translate(800 542)"/><circle class="node" cx="800" cy="460" r="6"/><path class="wire" d="M800 460H875"/><circle class="term" cx="882" cy="460" r="7"/><text class="label mono" x="900" y="467">MA → Motor A</text><text class="label mono" x="830" y="352">QHA</text><text class="label mono" x="830" y="537">QLA</text><use href="#vshunt" transform="translate(800 610) scale(.72)"/><text class="small mono" x="830" y="645">R42  1 mΩ</text><path class="wire" d="M800 709V697"/>
<!-- Phase B -->
<path class="wire" d="M1050 278V315M1050 399V460M1050 460V500M1050 584V610"/><use href="#fet" transform="translate(1050 357)"/><use href="#fet" transform="translate(1050 542)"/><circle class="node" cx="1050" cy="460" r="6"/><path class="wire" d="M1050 460H1125"/><circle class="term" cx="1132" cy="460" r="7"/><text class="label mono" x="1150" y="467">MB → Motor B</text><text class="label mono" x="1080" y="352">QHB</text><text class="label mono" x="1080" y="537">QLB</text><use href="#vshunt" transform="translate(1050 610) scale(.72)"/><text class="small mono" x="1080" y="645">R43  1 mΩ</text><path class="wire" d="M1050 709V697"/>
<!-- Phase C -->
<path class="wire" d="M1300 278V315M1300 399V460M1300 460V500M1300 584V610"/><use href="#fet" transform="translate(1300 357)"/><use href="#fet" transform="translate(1300 542)"/><circle class="node" cx="1300" cy="460" r="6"/><path class="wire" d="M1300 460H1375"/><circle class="term" cx="1382" cy="460" r="7"/><text class="label mono" x="1400" y="467">MC</text><text class="label mono" x="1330" y="352">QHC</text><text class="label mono" x="1330" y="537">QLC</text><use href="#vshunt" transform="translate(1300 610) scale(.72)"/><text class="small mono" x="1330" y="645">R44  1 mΩ</text><path class="wire" d="M1300 709V697"/>
<text class="small" x="1050" y="815" text-anchor="middle">MA, MB, and MC are electrically independent phase outputs. External controller not shown.</text>
</svg>