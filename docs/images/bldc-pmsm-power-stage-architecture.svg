<title id="title">BLDC / PMSM Power Stage Architecture</title>
<desc id="desc">Three-phase six-switch inverter with 6-PWM gate drive, three-shunt INA181 current sensing, Hall sensing, back-EMF sensing using LM339, and DC-bus voltage sensing.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#172033}.title{font-size:44px;font-weight:700}.subtitle{font-size:25px;fill:#374151}.section{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:14px}.tiny{font-size:12px}.muted{fill:#556071}.box{fill:#ffffff;stroke:#a8b1bf;stroke-width:1.5}.dash{fill:none;stroke:#a8b1bf;stroke-width:1.4;stroke-dasharray:7 6}.wire{fill:none;stroke:#202733;stroke-width:2}.sig{fill:none;stroke:#173b8f;stroke-width:2}.sense{fill:none;stroke:#147a38;stroke-width:2}.hall{fill:none;stroke:#d86400;stroke-width:2}.bemf{fill:none;stroke:#6f238b;stroke-width:2}.bus{fill:none;stroke:#173b8f;stroke-width:2}.node{fill:#202733}.term{fill:#fff;stroke:#202733;stroke-width:1.5}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
