<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">BLDC / PMSM Power Stage Architecture</title>
<desc id="desc">External 6-PWM gate-drive interface feeding three independent inverter half bridges with low-side current shunts.</desc>
<rect width="1200" height="680" fill="#ffffff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#172033}.title{font-size:42px;font-weight:700}.subtitle{font-size:23px;fill:#374151}.section{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px;fill:#556071}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wire{fill:none;stroke:#202733;stroke-width:2.4}.sig{fill:none;stroke:#173b8f;stroke-width:2.4}.box{fill:#fff;stroke:#173b8f;stroke-width:2}.powerbox{fill:#fff;stroke:#d72c2c;stroke-width:2.2}.node{fill:#202733}.term{fill:#fff;stroke:#202733;stroke-width:1.7}
</style>
<defs>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#173b8f" stroke-width="1.6"/></marker>
<g id="fet"><rect x="-18" y="-30" width="36" height="60" rx="4" fill="#fff" stroke="#202733" stroke-width="1.8"/><path d="M-32 0h10M-12-18v36M-4-21v42M-4-21h13M-4 21h13" class="wire"/><path d="M9-21v11M9 10v11" class="wire"/><path d="M3 7l11-14H3z" fill="#202733"/></g>
<g id="vshunt"><path d="M0 0v8l-9 10 18 14-18 14 18 14-9 10v8" class="wire"/></g>
</defs>
<text class="title" x="600" y="48" text-anchor="middle">BLDC / PMSM Power Stage Architecture</text>
<text class="subtitle" x="600" y="82" text-anchor="middle">6-PWM Gate Drive + Three-Phase Six-Switch Inverter</text>

<text class="section" x="45" y="145" fill="#173b8f">PWM INPUTS</text>
<text class="small" x="45" y="168">from external controller</text>
<g class="label mono"><text x="45" y="220">INHA</text><text x="45" y="270">INLA</text><text x="45" y="320">INHB</text><text x="45" y="370">INLB</text><text x="45" y="420">INHC</text><text x="45" y="470">INLC</text></g>
<g class="sig" marker-end="url(#arrowBlue)"><path d="M105 214H165"/><path d="M105 264H165"/><path d="M105 314H165"/><path d="M105 364H165"/><path d="M105 414H165"/><path d="M105 464H165"/></g>
<rect class="box" x="170" y="190" width="165" height="315" rx="14"/>
<text class="section" x="252" y="325" text-anchor="middle" fill="#173b8f">3× Half-Bridge</text><text class="section" x="252" y="352" text-anchor="middle" fill="#173b8f">Gate Driver</text>
<g class="label mono" fill="#173b8f"><text x="350" y="220">HOA</text><text x="350" y="270">LOA</text><text x="350" y="320">HOB</text><text x="350" y="370">LOB</text><text x="350" y="420">HOC</text><text x="350" y="470">LOC</text></g>
<g class="sig" marker-end="url(#arrowBlue)"><path d="M335 214H410"/><path d="M335 264H410"/><path d="M335 314H410"/><path d="M335 364H410"/><path d="M335 414H410"/><path d="M335 464H410"/></g>

<rect class="powerbox" x="425" y="125" width="730" height="430" rx="18"/>
<text class="section" x="790" y="155" text-anchor="middle" fill="#d72c2c">THREE-PHASE POWER STAGE</text>
<text class="small" x="790" y="177" text-anchor="middle">three independent half-bridge phase nodes</text>
<text class="label" x="448" y="220">VM</text><circle class="term" cx="485" cy="214" r="5"/><path class="wire" d="M490 214H1095"/>
<text class="label" x="448" y="520">GND</text><circle class="term" cx="485" cy="514" r="5"/><path class="wire" d="M490 514H1095"/>

<!-- Phase A -->
<path class="wire" d="M610 214V245M610 305V350M610 350V385M610 445V470"/><use href="#fet" transform="translate(610 275)"/><use href="#fet" transform="translate(610 415)"/><circle class="node" cx="610" cy="350" r="5"/><path class="wire" d="M610 350H680"/><circle class="term" cx="685" cy="350" r="5"/><text class="label mono" x="698" y="356">MA</text><text class="small" x="698" y="377">Motor phase A</text><text class="label mono" x="636" y="280">QHA</text><text class="label mono" x="636" y="420">QLA</text><use href="#vshunt" transform="translate(610 470) scale(.58)"/><text class="small mono" x="635" y="488">R42 · 1 mΩ</text><path class="wire" d="M610 515V514"/>

<!-- Phase B -->
<path class="wire" d="M805 214V245M805 305V350M805 350V385M805 445V470"/><use href="#fet" transform="translate(805 275)"/><use href="#fet" transform="translate(805 415)"/><circle class="node" cx="805" cy="350" r="5"/><path class="wire" d="M805 350H875"/><circle class="term" cx="880" cy="350" r="5"/><text class="label mono" x="893" y="356">MB</text><text class="small" x="893" y="377">Motor phase B</text><text class="label mono" x="831" y="280">QHB</text><text class="label mono" x="831" y="420">QLB</text><use href="#vshunt" transform="translate(805 470) scale(.58)"/><text class="small mono" x="830" y="488">R43 · 1 mΩ</text><path class="wire" d="M805 515V514"/>

<!-- Phase C -->
<path class="wire" d="M1000 214V245M1000 305V350M1000 350V385M1000 445V470"/><use href="#fet" transform="translate(1000 275)"/><use href="#fet" transform="translate(1000 415)"/><circle class="node" cx="1000" cy="350" r="5"/><path class="wire" d="M1000 350H1070"/><circle class="term" cx="1075" cy="350" r="5"/><text class="label mono" x="1088" y="356">MC</text><text class="small" x="1088" y="377">Motor C</text><text class="label mono" x="1026" y="280">QHC</text><text class="label mono" x="1026" y="420">QLC</text><use href="#vshunt" transform="translate(1000 470) scale(.58)"/><text class="small mono" x="1025" y="488">R44 · 1 mΩ</text><path class="wire" d="M1000 515V514"/>

<text class="small" x="790" y="605" text-anchor="middle">MA, MB, and MC are electrically independent phase outputs.</text>
<text class="small" x="790" y="627" text-anchor="middle">External controller is intentionally outside the power-stage boundary.</text>
</svg>