<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">BLDC / PMSM Power Stage Architecture</title>
<desc id="desc">External 6-PWM interface, half-bridge gate driver, and three independent inverter phase legs with low-side current shunts.</desc>
<rect width="1200" height="650" fill="#fff"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111827}.title{font-size:38px;font-weight:700}.subtitle{font-size:21px;fill:#4b5563}.section{font-size:19px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#4b5563}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wire{fill:none;stroke:#1f2937;stroke-width:2.2}.thin{fill:none;stroke:#6b7280;stroke-width:1.5}.panel{fill:#fff;stroke:#9ca3af;stroke-width:1.6}.node{fill:#1f2937}.term{fill:#fff;stroke:#1f2937;stroke-width:1.6}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#1f2937" stroke-width="1.5"/></marker>
<g id="fet"><rect x="-17" y="-28" width="34" height="56" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.7"/><path d="M-30 0h9M-11-16v32M-3-19v38M-3-19h12M-3 19h12" class="wire"/><path d="M8-19v10M8 9v10" class="wire"/><path d="M3 6l10-12H3z" fill="#1f2937"/></g>
<g id="vshunt"><path d="M0 0v7l-8 9 16 13-16 13 16 13-8 9v7" class="wire"/></g>
</defs>
<text class="title" x="600" y="46" text-anchor="middle">BLDC / PMSM Power Stage Architecture</text>
<text class="subtitle" x="600" y="77" text-anchor="middle">6-PWM Gate Drive + Three-Phase Six-Switch Inverter</text>

<text class="section" x="48" y="143">PWM INPUTS</text>
<text class="small" x="48" y="164">from external controller</text>
<g class="label mono"><text x="48" y="216">INHA</text><text x="48" y="262">INLA</text><text x="48" y="308">INHB</text><text x="48" y="354">INLB</text><text x="48" y="400">INHC</text><text x="48" y="446">INLC</text></g>
<g class="wire" marker-end="url(#arrow)"><path d="M105 210H166"/><path d="M105 256H166"/><path d="M105 302H166"/><path d="M105 348H166"/><path d="M105 394H166"/><path d="M105 440H166"/></g>

<rect class="panel" x="170" y="180" width="160" height="295" rx="12"/>
<text class="section" x="250" y="310" text-anchor="middle">3× Half-Bridge</text>
<text class="section" x="250" y="336" text-anchor="middle">Gate Driver</text>
<g class="label mono"><text x="348" y="216">HOA</text><text x="348" y="262">LOA</text><text x="348" y="308">HOB</text><text x="348" y="354">LOB</text><text x="348" y="400">HOC</text><text x="348" y="446">LOC</text></g>
<g class="wire" marker-end="url(#arrow)"><path d="M330 210H410"/><path d="M330 256H410"/><path d="M330 302H410"/><path d="M330 348H410"/><path d="M330 394H410"/><path d="M330 440H410"/></g>

<rect class="panel" x="430" y="118" width="720" height="435" rx="16"/>
<text class="section" x="790" y="149" text-anchor="middle">THREE-PHASE POWER STAGE</text>
<text class="small" x="790" y="170" text-anchor="middle">three electrically independent half-bridge phase nodes</text>
<text class="label" x="455" y="215">VM</text><circle class="term" cx="492" cy="209" r="5"/><path class="wire" d="M497 209H1095"/>
<text class="label" x="452" y="515">GND</text><circle class="term" cx="492" cy="509" r="5"/><path class="wire" d="M497 509H1095"/>

<!-- Phase A: VM -> QHA -> MA -> QLA -> R42 -> GND -->
<path class="wire" d="M610 209V242M610 298V352M610 352V382M610 438V465"/>
<use href="#fet" transform="translate(610 270)"/><use href="#fet" transform="translate(610 410)"/>
<circle class="node" cx="610" cy="352" r="4.5"/><path class="wire" d="M610 352H678"/><circle class="term" cx="684" cy="352" r="5"/><text class="label mono" x="698" y="358">MA</text>
<text class="small mono" x="635" y="274">QHA</text><text class="small mono" x="635" y="414">QLA</text>
<use href="#vshunt" transform="translate(610 465) scale(.56)"/><text class="small mono" x="633" y="481">R42  1 mΩ</text><path class="wire" d="M610 505V509"/>

<!-- Phase B -->
<path class="wire" d="M805 209V242M805 298V352M805 352V382M805 438V465"/>
<use href="#fet" transform="translate(805 270)"/><use href="#fet" transform="translate(805 410)"/>
<circle class="node" cx="805" cy="352" r="4.5"/><path class="wire" d="M805 352H873"/><circle class="term" cx="879" cy="352" r="5"/><text class="label mono" x="893" y="358">MB</text>
<text class="small mono" x="830" y="274">QHB</text><text class="small mono" x="830" y="414">QLB</text>
<use href="#vshunt" transform="translate(805 465) scale(.56)"/><text class="small mono" x="828" y="481">R43  1 mΩ</text><path class="wire" d="M805 505V509"/>

<!-- Phase C -->
<path class="wire" d="M1000 209V242M1000 298V352M1000 352V382M1000 438V465"/>
<use href="#fet" transform="translate(1000 270)"/><use href="#fet" transform="translate(1000 410)"/>
<circle class="node" cx="1000" cy="352" r="4.5"/><path class="wire" d="M1000 352H1068"/><circle class="term" cx="1074" cy="352" r="5"/><text class="label mono" x="1088" y="358">MC</text>
<text class="small mono" x="1025" y="274">QHC</text><text class="small mono" x="1025" y="414">QLC</text>
<use href="#vshunt" transform="translate(1000 465) scale(.56)"/><text class="small mono" x="1023" y="481">R44  1 mΩ</text><path class="wire" d="M1000 505V509"/>

<text class="small" x="790" y="595" text-anchor="middle">MA, MB, and MC are independent motor phase outputs. External controller is not shown.</text>
</svg>
