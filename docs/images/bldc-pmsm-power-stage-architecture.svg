<rect class="dash" x="35" y="700" width="360" height="190" rx="14" stroke="#173b8f"/><text class="section" x="55" y="733" fill="#173b8f">INTERFACE SUMMARY</text><text class="small" x="55" y="766">• 6 complementary PWM inputs</text><text class="small" x="55" y="794">• External controller owns PWM timing and dead time</text><text class="small" x="55" y="822">• Three current-feedback channels: ISA / ISB / ISC</text><text class="small" x="55" y="850">• Hall, BEMF zero-cross, and VBUS feedback</text><text class="small" x="55" y="878">• Supports sensorless six-step and FOC</text>
